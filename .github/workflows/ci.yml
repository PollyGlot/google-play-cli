name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build, lint, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: gofmt
        run: |
          diff <(gofmt -d .) <(echo -n) || (echo '::error::run "make format" to fix formatting'; exit 1)

      - name: go vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          args: --timeout=5m

      - name: test
        run: go test -race ./...

      - name: build
        run: go build ./cmd/gplay

  docs:
    name: Docs sanity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify required files exist
        run: |
          set -euo pipefail
          missing=0
          for f in \
            CLAUDE.md \
            AGENTS.md \
            CONTEXT.md \
            CONTRIBUTING.md \
            CODE_OF_CONDUCT.md \
            LICENSE \
            README.md \
            SUPPORT.md \
            docs/DESIGN.md \
            docs/BACKLOG.md \
            docs/CI_CD.md \
            docs/adr/0001-credential-storage.md \
            docs/adr/0002-safe-production-defaults.md \
            docs/adr/0003-json-passthrough.md
          do
            if [ ! -f "$f" ]; then
              echo "::error file=$f::missing required file"
              missing=$((missing+1))
            fi
          done
          exit $missing
