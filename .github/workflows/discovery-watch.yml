name: Discovery Watch

# Weekly check of Google's Discovery documents against the offline snapshots
# under docs/discovery/. When Google publishes a new revision, this opens (or
# refreshes) a rolling PR with the regenerated snapshot + schema index. The PR
# is classified three ways so the title/body are an honest triage signal:
#   - surface       — methods added/removed (paths.txt diff) → grill the new
#                     surface under the maximal-coverage policy (ADR-0026).
#   - schema        — query params / fields / descriptions changed, but no
#                     method surface change; the body shows the schema diff.
#   - revision-only — ONLY the revision date stamp moved → genuinely safe.
# paths.txt tracks method existence only (id + verb + path), so it cannot tell
# schema from revision-only on its own — the classifier diffs everything minus
# the revision line to decide that (see the "Detect changes" step).
#
# ---------------------------------------------------------------------------
# Setup of the Discovery triage routine (PRD #501, slice #506)
# ---------------------------------------------------------------------------
# A schema/surface refresh is handed to a Claude routine that reads the diff
# against the code the CLI actually ships and answers with a label. Nothing in
# this repository creates that routine: it lives in the Claude app and has to be
# set up by hand, once. The four steps, in order:
#
# 1. Create the routine in the Claude app (Automations), triggered by webhook,
#    running on the subscription (no API key). Its prompt is the versioned brief
#    docs/agents/discovery-triage.md: paste its contents, or point at
#    https://github.com/PollyGlot/google-play-cli/blob/main/docs/agents/discovery-triage.md
#    and tell the routine to read it first. The brief takes exactly one input,
#    the PR number, and this workflow POSTs it as JSON:
#      {"pr": 498, "kind": "schema", "url": "https://github.com/.../pull/498",
#       "repository": "PollyGlot/google-play-cli"}
#    "kind" is "schema" or "surface"; a revision-only refresh never calls it.
# 2. Store the routine's "call via API" URL as the repository secret
#    DISCOVERY_TRIAGE_WEBHOOK_URL and the Bearer token generated next to it on
#    the routine page as DISCOVERY_TRIAGE_API_TOKEN. URL absent, the call is
#    skipped and the job summary says so: the labelling still happens, only the
#    bot stays asleep.
# 3. Set the repository variable DISCOVERY_TRIAGE_ENABLED to "true". This is the
#    kill switch: anything else (including absent) means no webhook call, with
#    the reason spelled out in the job summary. It is deliberately a variable and
#    not a secret, so that turning the bot off is visible in the repo settings.
# 4. Before relying on any of this, run the routine by hand on an already-merged
#    refresh PR (#498, a schema refresh) with its "run now" button, in read-only
#    mode, and check that it posts the four-basket verdict as a single comment
#    and picks a verdict label. Only then flip DISCOVERY_TRIAGE_ENABLED on.
#
# The four discovery:* labels already exist in the repository:
#   discovery:schema / discovery:surface  — set by this workflow (the input)
#   discovery:verdict-merge               — set by the routine, merges the PR
#                                           (see discovery-verdict.yml)
#   discovery:needs-decision              — set by the routine, notifies the
#                                           maintainer and merges nothing
#
# To replay the routine on an existing refresh PR without regenerating the
# snapshots, dispatch this workflow with the "pr" input.
on:
  schedule:
    - cron: '0 6 * * 1' # Mondays 06:00 UTC
  workflow_dispatch:
    inputs:
      pr:
        description: 'Refresh PR to hand back to the triage routine (skips the snapshot regeneration entirely)'
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  watch:
    name: Refresh Discovery snapshots
    runs-on: ubuntu-latest
    steps:
      # Same gplay App token pattern as release-please: a PR opened with the
      # default GITHUB_TOKEN would not trigger CI on itself.
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          app-id: ${{ secrets.GPLAY_APP_ID }}
          private-key: ${{ secrets.GPLAY_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: true

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25'
          cache: true

      # The "pr" dispatch input means "wake the routine on that PR again", not
      # "look at Google": everything that produces a diff is skipped, and the job
      # walks straight to the webhook call.
      - name: Regenerate snapshots and schema index
        if: inputs.pr == ''
        run: make discovery-update schema-index-update

      - name: Detect changes
        id: diff
        if: inputs.pr == ''
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No Discovery changes — snapshots are current."
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          # paths.txt only tracks method existence (id + verb + path), so a new
          # query param or schema field never shows up there — keying the label
          # off paths.txt alone mislabels such changes as "revision bump only"
          # (this is what happened on #320). So first ask the stronger question:
          # is there ANY change beyond the top-level "revision" date stamp? Strip
          # that one line — the leading two spaces pin it to the document root,
          # so a nested field literally named "revision" is never mistaken for it
          # — and see what survives.
          substantive=$(git diff -- docs/discovery/ internal/schemaindex/schema_index.json \
            | grep -E '^[+-]' \
            | grep -vE '^(\+\+\+|---) ' \
            | grep -vE '^[+-]  "revision": "[^"]+",?$' \
            || true)
          if [ -z "$substantive" ]; then
            kind=revision-only          # only the date stamp moved — genuinely safe
          elif git diff --quiet -- docs/discovery/paths.txt; then
            kind=schema                 # params/fields/descriptions changed, no new surface
          else
            kind=surface                # methods added/removed — ADR-0026 grilling
          fi
          {
            echo "kind=$kind"
            echo 'paths_diff<<PATHS_EOF'
            git diff -- docs/discovery/paths.txt | head -200
            echo 'PATHS_EOF'
            echo 'schema_diff<<SCHEMA_EOF'
            git diff -- docs/discovery/ internal/schemaindex/schema_index.json \
              | grep -vE '^[+-]  "revision": "[^"]+",?$' \
              | head -200
            echo 'SCHEMA_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Open or refresh the rolling PR
        id: pr
        if: inputs.pr == '' && steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          KIND: ${{ steps.diff.outputs.kind }}
          PATHS_DIFF: ${{ steps.diff.outputs.paths_diff }}
          SCHEMA_DIFF: ${{ steps.diff.outputs.schema_diff }}
        run: |
          set -euo pipefail
          BRANCH=chore/discovery-refresh
          git config user.name "gplay[bot]"
          git config user.email "gplay[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add docs/discovery/ internal/schemaindex/schema_index.json
          case "$KIND" in
            surface) TITLE="chore(discovery): API surface changed — refresh snapshots" ;;
            schema)  TITLE="chore(discovery): schema details changed — refresh snapshots" ;;
            *)       TITLE="chore(discovery): refresh snapshots (revision bump only)" ;;
          esac
          git commit -m "$TITLE"
          git push -f origin "$BRANCH"
          {
            echo "## Summary"
            case "$KIND" in
              surface)
                echo "- Google changed the **method surface** of a Discovery document. Review the diff below — under [ADR-0026](../blob/main/docs/adr/0026-maximal-admin-api-coverage.md) a new admin surface is in scope and should get a slice or PRD."
                echo
                echo '```diff'
                echo "$PATHS_DIFF"
                echo '```'
                ;;
              schema)
                echo "- Google changed **schema details** (query params, fields, or descriptions) — **no method was added or removed** (\`paths.txt\` is unchanged), so there is no new surface to grill under ADR-0026. This is **not** a no-op revision bump; review the schema diff below (the \`revision\` date line is elided as noise)."
                echo
                echo '```diff'
                echo "$SCHEMA_DIFF"
                echo '```'
                ;;
              *)
                echo "- Revision bump only — no method or schema changes. Safe to merge."
                ;;
            esac
            echo
            echo "_Opened automatically by the Discovery Watch workflow._"
          } > /tmp/pr-body.md
          if gh pr view "$BRANCH" --json state --jq .state 2>/dev/null | grep -q OPEN; then
            gh pr edit "$BRANCH" --title "$TITLE" --body-file /tmp/pr-body.md
          else
            gh pr create --title "$TITLE" --body-file /tmp/pr-body.md --base main --head "$BRANCH"
          fi
          echo "pr=$(gh pr view "$BRANCH" --json number --jq .number)" >> "$GITHUB_OUTPUT"

      # A schema/surface refresh needs a human (or the triage routine of #501)
      # to read the diff, so the only thing CI does is stamp the PR with a
      # machine-readable label: a downstream bot then finds the PR and its kind
      # without parsing the title, which is prose and free to change.
      - name: Label a schema or surface refresh
        if: inputs.pr == '' && steps.diff.outputs.changed == 'true' && steps.diff.outputs.kind != 'revision-only'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR: ${{ steps.pr.outputs.pr }}
          KIND: ${{ steps.diff.outputs.kind }}
        run: |
          set -euo pipefail
          # Both labels are removed first: the branch is rolling, so last week's
          # verdict must not survive into this week's classification.
          gh pr edit "$PR" \
            --remove-label discovery:schema --remove-label discovery:surface \
            --add-label "discovery:$KIND"

      # revision-only means the classifier found nothing beyond the date stamp,
      # so there is nothing for a human to read — the PR merges itself. Two
      # things stand between the classification and the merge button:
      #   1. the guard below, which re-derives the blast radius from the PR's
      #      own file list rather than trusting the classifier's diff (the two
      #      are computed at different times against a force-pushed branch);
      #   2. green CI, waited for rather than assumed.
      - name: Guard the merge blast radius
        if: steps.diff.outputs.changed == 'true' && steps.diff.outputs.kind == 'revision-only'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR: ${{ steps.pr.outputs.pr }}
        run: |
          set -euo pipefail
          # Auto-merge is only ever allowed to land generated files. Anything
          # else in the PR means the rolling branch picked up work that was never
          # classified: refuse and hand it back to a human. The check itself is
          # shared with the verdict-merge path (discovery-verdict.yml), so the
          # two merge buttons can never drift apart.
          if ! .github/scripts/discovery-blast-radius.sh "$PR"; then
            gh pr edit "$PR" --add-label discovery:needs-decision
            exit 1
          fi

      - name: Wait for CI and squash-merge
        id: merge
        if: steps.diff.outputs.changed == 'true' && steps.diff.outputs.kind == 'revision-only'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR: ${{ steps.pr.outputs.pr }}
        run: |
          set -euo pipefail
          # The force-push above may not have registered any check run yet, and
          # `gh pr checks --watch` exits non-zero on "no checks reported" rather
          # than waiting — so poll until at least one check exists.
          for _ in $(seq 1 30); do
            if gh pr checks "$PR" >/dev/null 2>&1; then break; fi
            sleep 20
          done
          gh pr checks "$PR" --watch --fail-fast --interval 30
          # --squash because the repo is squash-only; --admin because a bot
          # cannot approve its own PR and the review requirement would otherwise
          # deadlock the merge.
          gh pr merge "$PR" --squash --admin --delete-branch
          echo "merged=true" >> "$GITHUB_OUTPUT"

      # The webhook call takes the same three facts whether it was reached
      # through a fresh classification or through the "pr" dispatch input, so
      # both paths converge here rather than duplicating the curl.
      - name: Resolve the triage target
        id: target
        if: inputs.pr != '' || (steps.diff.outputs.changed == 'true' && steps.diff.outputs.kind != 'revision-only')
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          INPUT_PR: ${{ inputs.pr }}
          PR: ${{ steps.pr.outputs.pr }}
          KIND: ${{ steps.diff.outputs.kind }}
        run: |
          set -euo pipefail
          if [ -n "$INPUT_PR" ]; then
            pr="$INPUT_PR"
            # On a replay there is no classifier to ask, so the kind comes back
            # from the label this workflow stamped on the PR in the first place.
            kind=$(gh pr view "$pr" --json labels \
              --jq 'first(.labels[].name | select(. == "discovery:schema" or . == "discovery:surface")) // ""' \
              | sed 's/^discovery://')
            if [ -z "$kind" ]; then
              echo "::error::PR #$pr carries neither discovery:schema nor discovery:surface — nothing to triage."
              exit 1
            fi
          else
            pr="$PR"
            kind="$KIND"
          fi
          {
            echo "pr=$pr"
            echo "kind=$kind"
            echo "url=$(gh pr view "$pr" --json url --jq .url)"
          } >> "$GITHUB_OUTPUT"

      # Two switches stand between a labelled PR and the routine, and neither is
      # allowed to fail the job silently: an absent secret means the routine was
      # never set up, an off kill switch means someone turned the bot off on
      # purpose. Both leave the PR labelled and open, which is exactly the
      # pre-bot behaviour, and both say so in the job summary.
      - name: Call the Discovery triage routine
        id: routine
        if: steps.target.outputs.pr != ''
        env:
          ENABLED: ${{ vars.DISCOVERY_TRIAGE_ENABLED }}
          WEBHOOK_URL: ${{ secrets.DISCOVERY_TRIAGE_WEBHOOK_URL }}
          # The routine's "call via API" URL is authenticated with a Bearer token
          # generated on the routine page; without it the endpoint answers 401.
          API_TOKEN: ${{ secrets.DISCOVERY_TRIAGE_API_TOKEN }}
          PR: ${{ steps.target.outputs.pr }}
          KIND: ${{ steps.target.outputs.kind }}
          URL: ${{ steps.target.outputs.url }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ "${ENABLED:-}" != "true" ]; then
            echo "called=false" >> "$GITHUB_OUTPUT"
            echo "reason=the DISCOVERY_TRIAGE_ENABLED repository variable is not \`true\` (kill switch off)" >> "$GITHUB_OUTPUT"
            echo "Kill switch off: not calling the triage routine."
            exit 0
          fi
          if [ -z "${WEBHOOK_URL:-}" ]; then
            echo "called=false" >> "$GITHUB_OUTPUT"
            echo "reason=the DISCOVERY_TRIAGE_WEBHOOK_URL secret is not set (the routine has not been created yet)" >> "$GITHUB_OUTPUT"
            echo "No webhook secret: not calling the triage routine."
            exit 0
          fi
          payload=$(jq -n \
            --argjson pr "$PR" --arg kind "$KIND" --arg url "$URL" --arg repo "$REPO" \
            '{pr: $pr, kind: $kind, url: $url, repository: $repo}')
          # One attempt, no --retry: curl retries 5xx too, and firing the routine
          # three times over a flaky endpoint is worse than a red job. A failed
          # call leaves the PR labelled, and the "pr" dispatch input exists
          # precisely to replay it. The URL is a secret, so only the status code
          # is ever echoed.
          auth=()
          if [ -n "${API_TOKEN:-}" ]; then
            auth=(-H "Authorization: Bearer $API_TOKEN")
          fi
          code=$(curl -sS --max-time 30 \
            -o /tmp/routine-response.txt -w '%{http_code}' \
            -X POST -H 'Content-Type: application/json' "${auth[@]}" \
            -d "$payload" "$WEBHOOK_URL")
          if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then
            echo "::error::The triage routine webhook answered HTTP $code."
            head -c 500 /tmp/routine-response.txt || true
            exit 1
          fi
          echo "called=true" >> "$GITHUB_OUTPUT"
          echo "Triage routine called for PR #$PR ($KIND), HTTP $code."

      # Runs even when nothing changed, and even when a step above failed: a
      # silent Monday must be distinguishable from a dead workflow.
      - name: Job summary
        if: always()
        env:
          INPUT_PR: ${{ inputs.pr }}
          CHANGED: ${{ steps.diff.outputs.changed }}
          KIND: ${{ steps.diff.outputs.kind }}
          PR: ${{ steps.pr.outputs.pr }}
          MERGED: ${{ steps.merge.outputs.merged }}
          TARGET_PR: ${{ steps.target.outputs.pr }}
          TARGET_KIND: ${{ steps.target.outputs.kind }}
          CALLED: ${{ steps.routine.outputs.called }}
          REASON: ${{ steps.routine.outputs.reason }}
        run: |
          {
            echo "## Discovery Watch"
            if [ -n "${INPUT_PR:-}" ]; then
              echo
              echo "Manual replay: no snapshot was regenerated, PR #$INPUT_PR was handed back to the triage routine as-is."
            elif [ "${CHANGED:-false}" != "true" ]; then
              echo
              echo "No upstream change: Google's Discovery documents still match the offline snapshots. Nothing to review, no PR touched."
            else
              echo
              echo "- Classification: \`$KIND\`"
              echo "- Rolling PR: #$PR"
              case "$KIND" in
                revision-only)
                  if [ "${MERGED:-}" = "true" ]; then
                    echo "- Outcome: **auto-merged** (revision stamp only, blast radius verified, CI green)."
                  else
                    echo "- Outcome: **not merged** — the guard refused, or CI went red. Needs a human."
                  fi
                  ;;
                *)
                  echo "- Outcome: labelled \`discovery:$KIND\` and left open for triage."
                  ;;
              esac
            fi
            # Whether the routine was woken up is the one fact that decides
            # whether a human still has to look at the PR, so it gets its own
            # line, including (especially) when the answer is "no, because".
            if [ -n "${TARGET_PR:-}" ]; then
              echo
              echo "### Triage routine"
              echo
              if [ "${CALLED:-}" = "true" ]; then
                echo "Called for PR #$TARGET_PR (\`$TARGET_KIND\`). Expect a verdict comment and a \`discovery:verdict-merge\` or \`discovery:needs-decision\` label on the PR."
              elif [ -n "${REASON:-}" ]; then
                echo "**Not called** for PR #$TARGET_PR (\`$TARGET_KIND\`): $REASON."
                echo
                echo "The PR stays labelled and open; triage it by hand, then re-dispatch this workflow with the \`pr\` input once the routine is set up (see the workflow header)."
              else
                echo "**Not called** for PR #$TARGET_PR: the webhook step did not complete (it errored, or the job was cancelled). Triage the PR by hand."
              fi
            fi
          } >> "$GITHUB_STEP_SUMMARY"
