name: Release

on:
  # Called by release-please.yml once a Version PR merges and a release is cut.
  workflow_call:
    inputs:
      ref:
        description: Git ref (tag) to build and publish.
        type: string
        required: true
    secrets:
      HOMEBREW_TAP_GITHUB_TOKEN:
        description: PAT with contents:write on PollyGlot/homebrew-tap.
        required: false
  # Manual escape hatch. Deliberately NOT an auto `push: tags` trigger: now that
  # release-please uses a GitHub App token, its tag creation would fire push:tags
  # and race the workflow_call path with a duplicate GoReleaser run.
  workflow_dispatch:
    inputs:
      ref:
        description: Tag to build and publish (e.g. v0.1.0).
        type: string
        required: true

permissions:
  contents: read

jobs:
  goreleaser:
    name: GoReleaser
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write       # OIDC token for keyless cosign signing + attestations
      attestations: write   # publish GitHub build-provenance attestations
    steps:
      - name: Validate ref is a tag
        env:
          INPUT_REF: ${{ inputs.ref || github.ref }}
        run: |
          REF="$INPUT_REF"
          if [[ "$REF" != v* && "$REF" != refs/tags/v* ]]; then
            echo "Expected a tag ref like v0.1.0, got: $REF" >&2
            exit 1
          fi

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0  # GoReleaser reads the full git history for the changelog
          persist-credentials: false
          ref: ${{ inputs.ref || github.ref }}

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: '1.25'
          cache: true

      - name: Install cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3.9.1

      - name: Install syft (SBOM generator)
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@5daf1e915a5f0af01ddbcd89a43b8061ff4f1a89 # v7.2.2
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # PAT with `contents: write` on PollyGlot/homebrew-tap.
          # Without this secret, the brew step will fail — the release itself still publishes.
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}

      # Publish GitHub build-provenance attestations over the archives GoReleaser
      # wrote to dist/. This gives consumers an origin-independent way to verify a
      # binary was built by THIS repo's release workflow — `gh attestation verify
      # <archive> -R PollyGlot/google-play-cli` — complementing the cosign
      # signature over checksums.txt (which shares the same origin as the
      # binaries). See docs/CI_CD.md "Verify a release".
      - name: Attest build provenance
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
