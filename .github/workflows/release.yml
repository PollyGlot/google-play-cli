name: Release

on:
  # Called by release-please.yml once a Version PR merges and a release is cut.
  workflow_call:
    inputs:
      ref:
        description: Git ref (tag) to build and publish.
        type: string
        required: true
    secrets:
      HOMEBREW_TAP_GITHUB_TOKEN:
        description: PAT with contents:write on PollyGlot/homebrew-tap.
        required: false
      T3_RELEASE_ANNOUNCE_WEBHOOK_URL:
        description: Relay URL of the t3code release-announce webhook task.
        required: false
      T3_WEBHOOK_SECRET:
        description: HMAC key shared by the t3code webhook tasks.
        required: false
  # Manual escape hatch. Deliberately NOT an auto `push: tags` trigger: now that
  # release-please uses a GitHub App token, its tag creation would fire push:tags
  # and race the workflow_call path with a duplicate GoReleaser run.
  workflow_dispatch:
    inputs:
      ref:
        description: Tag to build and publish (e.g. v0.1.0).
        type: string
        required: true

permissions:
  contents: read

jobs:
  goreleaser:
    name: GoReleaser
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write       # OIDC token for keyless cosign signing + attestations
      attestations: write   # publish GitHub build-provenance attestations
      packages: write       # push the container image (+ signature, attestation) to GHCR
    steps:
      - name: Validate ref is a tag
        env:
          INPUT_REF: ${{ inputs.ref || github.ref }}
        run: |
          REF="$INPUT_REF"
          if [[ "$REF" != v* && "$REF" != refs/tags/v* ]]; then
            echo "Expected a tag ref like v0.1.0, got: $REF" >&2
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # GoReleaser reads the full git history for the changelog
          persist-credentials: false
          ref: ${{ inputs.ref || github.ref }}

      # go.mod is the single source of the Go version: setup-go installs the
      # exact patch named by its `toolchain` line (the `go` line is only the
      # floor for `go install` users). Every workflow reads the same file, so
      # CI, govulncheck and the shipped binary use one toolchain. Setting
      # GOTOOLCHAIN=local before this step would make setup-go fall back to
      # the `go` line (1.26.0, unpatched): don't.
      #
      # cache: false on purpose. This job signs (cosign keyless) and attests
      # what it builds, and setup-go's cache is main-scoped, i.e. writable by
      # any workflow that runs on main. Restoring it here would let a poisoned
      # entry flow into signed release binaries; the entry is ~5 MB and the
      # GoReleaser step takes the same time either way.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Install syft (SBOM generator)
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3

      # Container image (#659): GoReleaser's dockers_v2 builds and pushes the
      # multi-arch image with buildx, which needs a docker-container builder for
      # a multi-platform push and the SBOM attestation. No QEMU: the Dockerfile
      # only COPYs the prebuilt binaries, nothing runs for the foreign arch.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # GITHUB_TOKEN with this job's `packages: write`, no new secret. The
      # login also serves cosign (image signature) and the attestation push.
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.18.2
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # PAT with `contents: write` on PollyGlot/homebrew-tap.
          # Without this secret, the brew step will fail — the release itself still publishes.
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}

      # Publish GitHub build-provenance attestations over the archives GoReleaser
      # wrote to dist/. This gives consumers an origin-independent way to verify a
      # binary was built by THIS repo's release workflow — `gh attestation verify
      # <archive> -R PollyGlot/google-play-cli` — complementing the cosign
      # signature over checksums.txt (which shares the same origin as the
      # binaries). See docs/CI_CD.md "Verify a release".
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip

      # Same provenance for the image, keyed on the multi-arch index digest
      # GoReleaser pushed (every tag points at it), and stored in GHCR next to
      # the image: `gh attestation verify oci://ghcr.io/pollyglot/gplay:vX.Y.Z
      # -R PollyGlot/google-play-cli`.
      - name: Resolve image digest
        id: image
        run: |
          set -euo pipefail
          digests=$(jq -r '[.[] | select(.type == "Docker Image" and .extra.ID == "gplay") | .extra.Digest] | unique | .[]' dist/artifacts.json)
          if [ "$(printf '%s\n' "$digests" | grep -c .)" -ne 1 ]; then
            echo "Expected exactly one pushed image digest, got: ${digests:-none}" >&2
            exit 1
          fi
          echo "digest=$digests" >> "$GITHUB_OUTPUT"

      - name: Attest image build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/pollyglot/gplay
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true

  # Hands the published release to the release-announce agent, a t3code
  # webhook task on the maintainer's always-on machine (skills PR + Typefully
  # draft, never a publish). It replaces a repository webhook on `release`
  # events: GitHub cannot filter those by action, so one release fired ten
  # deliveries (published, released, created, then one `edited` per GoReleaser
  # update), each opening its own thread and worktree. Here it fires once, and
  # only after GoReleaser attached the binaries, so the announce never points
  # at a release nothing can be installed from yet.
  #
  # Setup: the task is signed like the other t3 tasks (see discovery-watch.yml,
  # step a) with T3_WEBHOOK_SECRET; its URL is the secret
  # T3_RELEASE_ANNOUNCE_WEBHOOK_URL. Its prompt reads {{body.event}},
  # {{body.action}} and {{body.release.*}}. An absent secret skips the call
  # with a notice, never fails the release. A workflow_dispatch replay fires
  # again; the agent reuses an existing Typefully draft for the tag.
  announce:
    name: Hand the release to the announce agent
    needs: goreleaser
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # The workflow's own ref, not the tag: a dispatch replaying an older tag
      # would check out a tree without fire-t3-task.sh.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts

      - name: Fire the release-announce task
        env:
          T3_URL: ${{ secrets.T3_RELEASE_ANNOUNCE_WEBHOOK_URL }}
          T3_SECRET: ${{ secrets.T3_WEBHOOK_SECRET }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          INPUT_REF: ${{ inputs.ref || github.ref }}
        run: |
          set -euo pipefail
          if [ -z "${T3_URL:-}" ] || [ -z "${T3_SECRET:-}" ]; then
            echo "::notice::Not calling the announce agent: T3_RELEASE_ANNOUNCE_WEBHOOK_URL or T3_WEBHOOK_SECRET is not set."
            exit 0
          fi
          tag=${INPUT_REF#refs/tags/}
          # The same fields a GitHub `release` delivery carries, read back from
          # the release GoReleaser just finished, so the task prompt keeps its
          # {{body.release.*}} placeholders.
          # Read into a variable first: on a 403/404 gh prints an error body,
          # and piping it straight in would sign and send that body.
          payload=$(gh api "repos/$REPO/releases/tags/$tag" \
            --jq '{event: "release", action: "published", release: {tag_name, prerelease, draft, html_url}}')
          code=$(printf '%s' "$payload" \
            | WEBHOOK_URL="$T3_URL" SIGNING_SECRET="$T3_SECRET" \
              .github/scripts/fire-t3-task.sh /tmp/announce-response.txt)
          if [ "${code:0:1}" != "2" ]; then
            echo "::error::The announce task answered HTTP $code; replay with a workflow_dispatch of this workflow once fixed."
            exit 1
          fi
          echo "Announce task fired for $tag (HTTP $code)."
