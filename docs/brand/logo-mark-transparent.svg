<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- gplay — mark only, transparent background. For lockups / placing the
       chevrons next to the wordmark on the shared dark surface. -->
  <defs>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="12" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g fill="none" stroke-width="64" stroke-linecap="round" stroke-linejoin="round">
    <path d="M310 372 L432 512 L310 652" stroke="#82afff" stroke-opacity="0.45"/>
    <path d="M450 372 L572 512 L450 652" stroke="#96e1f0" stroke-opacity="0.78"/>
    <path d="M590 372 L712 512 L590 652" stroke="#3DDC84" filter="url(#glow)"/>
  </g>
</svg>
