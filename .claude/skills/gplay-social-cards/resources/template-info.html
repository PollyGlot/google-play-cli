<!doctype html>
<!--
  gplay social card — info card (1600×900)
  Title + table + footer. Used for exit codes, comparisons, design rules.
  EDIT ONLY the marked lines. Do not touch CSS/palette.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans+Code:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#050507;--ink:#fff;--ink-soft:#d4d4d8;--ink-mute:#8a8a90;--ink-faint:#5a5a60;--green:#3DDC84;--red:#ff7a7a;--magenta:255,110,195;--blue:130,175,255}
    *{margin:0;padding:0;box-sizing:border-box}
    html,body{width:1600px;height:900px;overflow:hidden;background:var(--bg);font-family:'Google Sans Code',monospace}
    .card{position:relative;width:1600px;height:900px;overflow:hidden}
    .aurora{position:absolute;inset:0;z-index:0;
      background:
        radial-gradient(ellipse 900px 700px at 95% 15%,rgba(var(--magenta),0.32),transparent 70%),
        radial-gradient(ellipse 800px 700px at 100% 50%,rgba(var(--blue),0.26),transparent 70%);
      filter:blur(60px) saturate(120%);pointer-events:none}
    .grid{position:absolute;inset:0;z-index:1;
      background-image:linear-gradient(rgba(255,255,255,0.015) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,0.015) 1px,transparent 1px);
      background-size:56px 56px;pointer-events:none}
    .stage{position:relative;z-index:2;width:100%;height:100%;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;padding:100px 140px;gap:48px}
    .title{font-size:88px;font-weight:700;color:var(--ink);letter-spacing:-2.5px;line-height:1.0}
    .title .green{color:var(--green)}
    .table{display:grid;grid-template-columns:auto auto 1fr;column-gap:48px;row-gap:22px;font-size:30px;line-height:1.3;align-items:baseline}
    .code{color:var(--ink);font-weight:700;text-align:right;min-width:48px;font-variant-numeric:tabular-nums}
    .arrow{color:var(--ink-faint)}
    .desc{color:var(--ink-soft);font-weight:400}
    /* Plain colored markers — no pill boxes */
    .retry{color:var(--green);margin-left:24px;font-weight:500}
    .norry{color:var(--red);margin-left:24px;font-weight:500}
    .footer{font-size:22px;color:var(--ink-mute);font-weight:400;line-height:1.4;max-width:900px;margin-top:8px}
  </style>
</head>
<body>
  <div class="card">
    <div class="aurora"></div><div class="grid"></div>
    <div class="stage">

      <!-- EDIT: title — 1-3 words. Optional green period accent via <span class="green">.</span> -->
      <div class="title">Semantic<br>exit codes<span class="green">.</span></div>

      <!-- EDIT: 5-9 rows. Pattern: code + arrow + desc + optional <span class="retry">…</span> or <span class="norry">…</span> -->
      <div class="table">
        <div class="code">10</div><div class="arrow">→</div><div class="desc">auth missing</div>
        <div class="code">11</div><div class="arrow">→</div><div class="desc">authorization denied</div>
        <div class="code">20</div><div class="arrow">→</div><div class="desc">validation error</div>
        <div class="code">30</div><div class="arrow">→</div><div class="desc">API 4xx<span class="norry">don't retry</span></div>
        <div class="code">40</div><div class="arrow">→</div><div class="desc">API 5xx<span class="retry">retry</span></div>
        <div class="code">50</div><div class="arrow">→</div><div class="desc">network<span class="retry">retry</span></div>
        <div class="code">60</div><div class="arrow">→</div><div class="desc">state conflict<span class="retry">retry-once</span></div>
      </div>

      <!-- EDIT: footer — one line, sentence case -->
      <div class="footer">Your CI knows when to bail, retry, or alert.</div>

    </div>
  </div>
</body>
</html>
