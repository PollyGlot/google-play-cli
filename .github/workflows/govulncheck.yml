name: govulncheck

on:
  schedule:
    - cron: '17 4 * * 1'  # Weekly, Monday 04:17 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'go.mod'
      - 'go.sum'
  # Scan a dependency bump (Dependabot gomod PRs included) before it merges.
  # Not a required check: it only runs on PRs that touch the module files.
  pull_request:
    paths:
      - 'go.mod'
      - 'go.sum'

permissions:
  contents: read

jobs:
  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Same toolchain as the release (go.mod's `toolchain` line), so the
      # standard-library findings are evaluated against the Go gplay ships.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # Pinned, not @latest: an unpinned install broke this scan twice when
      # golang.org/x/vuln raised its own Go floor. Bump deliberately.
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.8.0

      - name: govulncheck
        run: |
          go version
          govulncheck -version
          govulncheck ./...
