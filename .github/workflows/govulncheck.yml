name: govulncheck

on:
  schedule:
    - cron: '17 4 * * 1'  # Weekly, Monday 04:17 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'go.mod'
      - 'go.sum'

permissions:
  contents: read

jobs:
  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Go 1.26 here, not go.mod's 1.25: the action installs govulncheck@latest
      # (no version input in v1.1.0), and golang.org/x/vuln v1.8.0 requires
      # go >= 1.26 while setup-go pins GOTOOLCHAIN=local. A newer toolchain
      # builds a `go 1.25.0` module fine; an older one skips the scan silently.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'
          cache: true

      # golang/govulncheck-action is a composite action; v1 already delegates to
      # actions/checkout@v6 + actions/setup-go@v6, which run on Node 24.
      - uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1.1.0
        with:
          go-version-input: '1.26'
          go-package: './...'
