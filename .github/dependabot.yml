# Dependabot keeps the SHA-pinned GitHub Actions from rotting: every workflow
# action is pinned to a full commit SHA (with a trailing version comment) so a
# hijacked or force-moved tag cannot compromise CI or the release pipeline.
# Dependabot proposes updates (new SHA + refreshed comment) on a weekly cadence.
# See PRD #206 / .github/workflows/* and the CONTRIBUTING pinning note.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    labels:
      - dependencies
    commit-message:
      prefix: chore
    groups:
      # github/codeql-action ships init, autobuild and analyze from one repo and
      # refuses to run when they disagree ("configuration error"). Ungrouped,
      # Dependabot opens one PR per sub-action and every one of them is red.
      codeql-action:
        patterns:
          - "github/codeql-action*"
