name: Release

on:
  # Called by release-please.yml once a Version PR merges and a release is cut.
  workflow_call:
    inputs:
      ref:
        description: Git ref (tag) to build and publish.
        type: string
        required: true
    secrets:
      HOMEBREW_TAP_GITHUB_TOKEN:
        description: PAT with contents:write on PollyGlot/homebrew-tap.
        required: false
  # Manual escape hatch. Deliberately NOT an auto `push: tags` trigger: now that
  # release-please uses a GitHub App token, its tag creation would fire push:tags
  # and race the workflow_call path with a duplicate GoReleaser run.
  workflow_dispatch:
    inputs:
      ref:
        description: Tag to build and publish (e.g. v0.1.0).
        type: string
        required: true

permissions:
  contents: read

jobs:
  goreleaser:
    name: GoReleaser
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write  # OIDC token for keyless cosign signing
    steps:
      - name: Validate ref is a tag
        env:
          INPUT_REF: ${{ inputs.ref || github.ref }}
        run: |
          REF="$INPUT_REF"
          if [[ "$REF" != v* && "$REF" != refs/tags/v* ]]; then
            echo "Expected a tag ref like v0.1.0, got: $REF" >&2
            exit 1
          fi

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0  # GoReleaser reads the full git history for the changelog
          persist-credentials: false
          ref: ${{ inputs.ref || github.ref }}

      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache: true

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Install syft (SBOM generator)
        uses: anchore/sbom-action/download-syft@v0

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # PAT with `contents: write` on PollyGlot/homebrew-tap.
          # Without this secret, the brew step will fail — the release itself still publishes.
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
