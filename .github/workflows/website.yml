name: Website

# Builds and deploys the gplay website (website/) to GitHub Pages — the
# interim draft/beta hosting for issue #86 until the gplay.sh domain is live.
#
# The CLI reference pages are generated at build time from the compiled gplay
# binary (website/scripts/gen-reference.mjs), so the site is also redeployed
# on every published release to keep the reference in sync with the shipped
# surface.

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - '.github/workflows/website.yml'
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: website-pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write # configure-pages needs it to auto-enable Pages (enablement: true)
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache: true

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Build gplay (source of the generated CLI reference)
        run: make build

      - name: Install site dependencies
        working-directory: website
        run: npm ci

      - name: Build site
        working-directory: website
        run: npm run build

      - uses: actions/configure-pages@v6
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v5
        with:
          path: website/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
