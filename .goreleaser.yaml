# GoReleaser configuration for gplay.
# See https://goreleaser.com for full docs. Local snapshot: `make release-snapshot`.

version: 2

project_name: gplay

before:
  hooks:
    - go mod tidy

builds:
  - id: gplay
    main: ./cmd/gplay
    binary: gplay
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    # -trimpath strips the builder's filesystem paths from the binary, so
    # releases don't embed local GOPATH/module-cache directories and builds
    # are more reproducible (ADR-0008 release pipeline; PRD #206).
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}

archives:
  - id: gplay
    formats: [tar.gz]
    name_template: "gplay_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md
      - CONTEXT.md

checksum:
  name_template: "checksums.txt"

# Software Bill of Materials, one SPDX doc per archive. Needs `syft` on PATH
# (the release workflow installs it; `make release-snapshot` skips this stage).
sboms:
  - id: archives
    artifacts: archive

# Keyless cosign signature over checksums.txt. Signing the checksum file
# transitively covers every artifact it lists. Needs `cosign` on PATH and
# `id-token: write` in CI (OIDC). Produces checksums.txt.sigstore.json.
signs:
  - cmd: cosign
    signature: "${artifact}.sigstore.json"
    args:
      - "sign-blob"
      - "--bundle=${signature}"
      - "${artifact}"
      - "--yes"
    artifacts: checksum
    output: true

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  use: github-native

release:
  github:
    owner: PollyGlot
    name: google-play-cli
  # release-please creates the GitHub Release (with its changelog body) before
  # GoReleaser runs. keep-existing means we attach artifacts without clobbering
  # that body. The header below only applies on the manual `git tag` path.
  mode: keep-existing
  draft: false
  prerelease: auto
  name_template: "v{{.Version}}"
  header: |
    ## gplay {{.Tag}}

    Install:
    ```bash
    brew install PollyGlot/tap/gplay
    # or
    curl -fsSL https://gplay.sh/install | sh
    ```

brews:
  - name: gplay
    repository:
      owner: PollyGlot
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Formula
    homepage: "https://github.com/PollyGlot/google-play-cli"
    description: "Fast, lightweight CLI for the Google Play Developer API."
    license: "MIT"
    test: |
      system "#{bin}/gplay", "version"
    install: |
      bin.install "gplay"
