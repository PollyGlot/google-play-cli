# GoReleaser configuration for gplay.
# See https://goreleaser.com for full docs. Local snapshot: `make release-snapshot`.

version: 2

project_name: gplay

# Check, never mutate: a plain `go mod tidy` here rewrote go.mod after the
# tag was cut, so the shipped binary carried `+dirty` and vcs.modified=true
# and differed from the tagged tree. `-diff` fails the release instead; the
# lint job (`make lint`, ci.yml) runs the same check on every PR.
before:
  hooks:
    - go mod tidy -diff

builds:
  - id: gplay
    main: ./cmd/gplay
    binary: gplay
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    # -trimpath strips the builder's filesystem paths from the binary, so
    # releases don't embed local GOPATH/module-cache directories and builds
    # are more reproducible (ADR-0008 release pipeline; PRD #206).
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}

archives:
  - id: gplay
    formats: [tar.gz]
    name_template: "gplay_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md
      - CONTEXT.md

checksum:
  name_template: "checksums.txt"

# Software Bill of Materials, one SPDX doc per archive. Needs `syft` on PATH
# (the release workflow installs it; `make release-snapshot` skips this stage).
sboms:
  - id: archives
    artifacts: archive

# Keyless cosign signature over checksums.txt. Signing the checksum file
# transitively covers every artifact it lists. Needs `cosign` on PATH and
# `id-token: write` in CI (OIDC). Produces checksums.txt.sigstore.json.
signs:
  - cmd: cosign
    signature: "${artifact}.sigstore.json"
    args:
      - "sign-blob"
      - "--bundle=${signature}"
      - "${artifact}"
      - "--yes"
    artifacts: checksum
    output: true

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  use: github-native

release:
  github:
    owner: PollyGlot
    name: google-play-cli
  # release-please creates the GitHub Release (with its changelog body) before
  # GoReleaser runs. keep-existing means we attach artifacts without clobbering
  # that body. The header below only applies on the manual `git tag` path.
  mode: keep-existing
  draft: false
  prerelease: auto
  name_template: "v{{.Version}}"
  header: |
    ## gplay {{.Tag}}

    Install:
    ```bash
    brew install PollyGlot/tap/gplay
    # or
    curl -fsSL https://gplay.sh/install | sh
    ```

# A Homebrew Cask, not a Formula: GoReleaser deprecated `brews` (the generated
# formula only ever wrapped the prebuilt binary, which is what a cask is for),
# and `goreleaser check` fails on it. The cask carries the macOS and Linux
# archives, so Linuxbrew keeps working (`binary` casks install on both).
# Pushed straight to Casks/gplay.rb on the tap's default branch, like the
# formula was: the tap must never require a PR, or the release breaks.
# Moving existing formula users over is a one-time tap change (delete
# Formula/gplay.rb, add tap_migrations.json); see #601.
homebrew_casks:
  - name: gplay
    binaries:
      - gplay
    repository:
      owner: PollyGlot
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    homepage: "https://gplay.sh"
    description: "Fast, lightweight CLI for the Google Play Developer API."
    # Homebrew quarantines what a cask downloads (a formula it does not), and
    # the darwin binary is not notarized: without this step, Gatekeeper refuses
    # to run it. The archive's integrity is still checked against the cask's
    # sha256 before this runs.
    #
    # Written as a custom_block, not `hooks.post.install`: GoReleaser 2.18
    # renders hooks as a `postflight` block, which Homebrew 7 deprecated, so
    # every install would print "Calling `postflight` is deprecated" and point
    # users at the tap. `postflight_steps` is the declarative replacement.
    # GoReleaser 2.19 adds `hooks.post.install_steps` for this
    # (goreleaser/goreleaser#6873); move there once the pin reaches it. The
    # `{{ "{{staged_path}}" }}` escape keeps Homebrew's install-time token out
    # of GoReleaser's own template pass.
    custom_block: |
      postflight_steps do
        on_macos do
          run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ "{{staged_path}}" }}/gplay"]
        end
      end
