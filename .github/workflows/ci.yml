name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push to a PR supersedes the older run, so a PR keeps one group per
# ref and cancels. A push to main gets a group of its own (the run id) and never
# cancels: two merges landing seconds apart must both get a verdict (a
# cancelled main run hid whether #547 alone was sound) and both save the living
# Go cache. Turning cancel-in-progress off on a shared group would not be
# enough: GitHub still cancels the pending run when a third one queues, which
# is also why the group is per run and not per sha. See docs/CI_CD.md
# § "Concurrency: PRs cancel, main never does".
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # The scope verdict the `build` aggregator reads. The Go jobs run the same
  # action themselves instead of waiting for it. See docs/CI_CD.md
  # § "Path-based job gating".
  changes:
    name: Detect change scope
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.scope.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/change-scope
        id: scope

  # "Build, lint, test" used to be one serial job (gofmt, vet, golangci-lint,
  # `go test -race`, build: ~7.5 min, the test step alone ~6.5 min). It is now
  # three jobs: `lint` and the `test` shards run in parallel, and `build` is the
  # aggregator that carries the required check's name. See docs/CI_CD.md
  # § "Build, lint, test: parallel jobs and a living Go cache".
  lint:
    name: Lint (gofmt, golangci-lint, build)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No `needs: changes`, so the wave asks for its runners at once instead
      # of after `changes`. Every later step here, in `test` and in `fuzz` is
      # gated on this scope; a step missing the `if:` just runs on docs-only.
      - uses: ./.github/actions/change-scope
        id: scope

      # Same living cache as the `test` shards (see there), under its own key:
      # golangci-lint spends most of its time compiling the project's packages.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: steps.scope.outputs.code == 'true'
        id: go
        with:
          go-version-file: go.mod
          cache: false

      - name: Locate Go caches
        if: steps.scope.outputs.code == 'true'
        id: gocache
        run: |
          echo "build=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
          echo "mod=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"

      - name: Restore Go build and module cache
        if: steps.scope.outputs.code == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.gocache.outputs.build }}
            ${{ steps.gocache.outputs.mod }}
          key: go-lint-${{ runner.os }}-go${{ steps.go.outputs.go-version }}-${{ github.sha }}
          restore-keys: |
            go-lint-${{ runner.os }}-go${{ steps.go.outputs.go-version }}-

      - name: gofmt
        if: steps.scope.outputs.code == 'true'
        run: |
          diff <(gofmt -d .) <(echo -n) || (echo '::error::run "make format" to fix formatting'; exit 1)

      # The release hook runs the same check (.goreleaser.yaml): a go.mod or
      # go.sum that drifts from `go mod tidy` fails here, on the PR, rather
      # than at tag time.
      - name: go mod tidy
        if: steps.scope.outputs.code == 'true'
        run: go mod tidy -diff || (echo '::error::run "go mod tidy" and commit go.mod/go.sum'; exit 1)

      # No separate `go vet ./...`: the `govet` linter enabled in .golangci.yml
      # runs the same analyzer passes. Checked on a probe package wired to trip
      # 18 `go vet` diagnostics across 18 analyzers, `golangci-lint run` with
      # this repo's config reports all 18 (see docs/CI_CD.md § "One lint pass,
      # not two").
      #
      # golangci-lint refuses to lint for a Go newer than the Go it was built
      # with, and it targets go.mod's `toolchain` line: moving that line to a
      # new minor needs a golangci-lint release built with it (v2.13.2: go1.27).
      # A patch can bump the export data format too: go1.27.2 needs v2.15.0.
      - name: golangci-lint
        if: steps.scope.outputs.code == 'true'
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0

      - name: build
        if: steps.scope.outputs.code == 'true'
        run: go build ./cmd/gplay

      - name: Save Go build and module cache
        if: steps.scope.outputs.code == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.gocache.outputs.build }}
            ${{ steps.gocache.outputs.mod }}
          key: go-lint-${{ runner.os }}-go${{ steps.go.outputs.go-version }}-${{ github.sha }}

  test:
    name: Test (shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    strategy:
      # Let every shard finish: one red shard should not hide a second one.
      fail-fast: false
      matrix:
        # The shard count is read back from strategy.job-total below, so adding
        # a shard means adding a number here and nothing else.
        shard: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/change-scope
        id: scope

      # setup-go's own cache is keyed on go.sum only and is never rewritten once
      # the key exists, so it never holds the project's compiled packages or
      # test results. The explicit cache below replaces it.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: steps.scope.outputs.code == 'true'
        id: go
        with:
          go-version-file: go.mod
          cache: false

      - name: Locate Go caches
        if: steps.scope.outputs.code == 'true'
        id: gocache
        run: |
          echo "build=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
          echo "mod=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"

      # A living cache: one entry per main commit (the key ends in the sha),
      # restored by prefix. PRs only read it; only pushes to main write it (see
      # the save step), so a PR can never feed the cache another PR reads.
      - name: Restore Go build and module cache
        if: steps.scope.outputs.code == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.gocache.outputs.build }}
            ${{ steps.gocache.outputs.mod }}
          key: go-test-${{ runner.os }}-go${{ steps.go.outputs.go-version }}-shard${{ strategy.job-index }}of${{ strategy.job-total }}-${{ github.sha }}
          restore-keys: |
            go-test-${{ runner.os }}-go${{ steps.go.outputs.go-version }}-shard${{ strategy.job-index }}of${{ strategy.job-total }}-
            go-test-${{ runner.os }}-go${{ steps.go.outputs.go-version }}-

      # Packages are dealt round-robin over `go list ./...`, so every package
      # lands in exactly one shard and a new package needs no CI edit. The few
      # packages whose tests run far longer than the rest are dealt first, one
      # per shard, so they never stack up on the same runner; a stale name in
      # that list is simply ignored.
      - name: go test -race (shard ${{ matrix.shard }} of ${{ strategy.job-total }})
        if: steps.scope.outputs.code == 'true'
        env:
          SHARD: ${{ strategy.job-index }}
          SHARDS: ${{ strategy.job-total }}
        run: |
          set -euo pipefail
          module=$(go list -m)
          slow="internal/artifact commands/releases/upload commands/releases/expansion-files/upload internal/metadata/imagevalidate"
          all=$(go list ./...)
          ordered=$(
            for s in $slow; do grep -xF "$module/$s" <<<"$all" || true; done
            grep -vxF -f <(for s in $slow; do echo "$module/$s"; done) <<<"$all"
          )
          # Guard: the reordering must neither drop nor duplicate a package.
          if [ "$(sort <<<"$ordered")" != "$(sort <<<"$all")" ]; then
            echo '::error::shard package list does not match go list ./...'
            exit 1
          fi
          mapfile -t pkgs < <(awk -v n="$SHARDS" -v i="$SHARD" '(NR-1) % n == i' <<<"$ordered")
          echo "shard $SHARD/$SHARDS: ${#pkgs[@]} of $(wc -l <<<"$all") packages"
          go test -race "${pkgs[@]}"

      - name: Save Go build and module cache
        if: steps.scope.outputs.code == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.gocache.outputs.build }}
            ${{ steps.gocache.outputs.mod }}
          key: go-test-${{ runner.os }}-go${{ steps.go.outputs.go-version }}-shard${{ strategy.job-index }}of${{ strategy.job-total }}-${{ github.sha }}

  build:
    name: Build, lint, test
    runs-on: ubuntu-latest
    needs: [changes, lint, test]
    # NOTE: "Build, lint, test" is a required check on main, and a *skipped*
    # required job blocks merge (GitHub treats skipped as unsatisfied). So this
    # aggregator runs whatever happened upstream, failures included, and then
    # re-derives the verdict itself. On a docs-only PR `lint` and `test` skip
    # every step after their own scope check, and this job goes green on
    # `code` false alone; on a code PR it is green only if `lint` and every
    # `test` shard succeeded.
    # `!cancelled()`, not `always()`: a superseded PR run skips this job instead
    # of painting the required check red with "change scope detection did not
    # succeed (cancelled)". Still fail-closed: the newer run reports the check,
    # and a head whose only run was cancelled has no "Build, lint, test" at
    # all, which blocks merge.
    if: ${{ !cancelled() }}
    steps:
      - name: Aggregate lint and test results
        env:
          CHANGES: ${{ needs.changes.result }}
          CODE: ${{ needs.changes.outputs.code }}
          LINT: ${{ needs.lint.result }}
          TEST: ${{ needs.test.result }}
        run: |
          echo "changes=$CHANGES code=$CODE lint=$LINT test=$TEST"
          # A failed scope detection leaves `code` empty, which would otherwise
          # read as docs-only and wave the PR through untested.
          if [ "$CHANGES" != success ]; then
            echo "::error::change scope detection did not succeed ($CHANGES)"
            exit 1
          fi
          if [ "$CODE" != true ]; then
            echo 'docs/site-only change: lint and tests skipped by design'
            exit 0
          fi
          # `needs.test.result` is the matrix as a whole: failure or cancelled
          # if any shard is.
          if [ "$LINT" != success ] || [ "$TEST" != success ]; then
            echo "::error::lint=$LINT test=$TEST"
            exit 1
          fi

  fuzz:
    name: Fuzz smoke (untrusted-input parsers)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    # Every target is bounded by an iteration count, so nothing else bounds
    # the job: a pathological input that slows the parser to a crawl must not
    # hold a runner for the default six hours.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/change-scope
        id: scope

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: steps.scope.outputs.code == 'true'
        id: go
        with:
          go-version-file: go.mod
          cache: false

      - name: Locate Go caches
        if: steps.scope.outputs.code == 'true'
        id: gocache
        run: |
          echo "build=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
          echo "mod=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"

      # Read-only: the `lint` job's living cache (modules plus the packages
      # fuzzing does not instrument). It never holds a fuzz corpus, since only
      # `lint` on main writes it. This job saves nothing.
      - name: Restore Go build and module cache
        if: steps.scope.outputs.code == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.gocache.outputs.build }}
            ${{ steps.gocache.outputs.mod }}
          key: go-lint-${{ runner.os }}-go${{ steps.go.outputs.go-version }}-${{ github.sha }}
          restore-keys: |
            go-lint-${{ runner.os }}-go${{ steps.go.outputs.go-version }}-

      # Short fuzzing of every parser that consumes untrusted bytes. The seed
      # corpora already run as ordinary cases in `test`; this looks for
      # crashers in generated input. It is a smoke, not a campaign.
      #
      # All targets run at once, one fuzz worker each, and each stops after a
      # fixed number of executions rather than a wall-clock -fuzztime. The
      # clock bound was what flaked: the coordinator's deadline could expire
      # mid-shutdown ("context deadline exceeded"), even from a fresh corpus
      # (#384 did not end it). A count has no deadline.
      #
      # A pull request runs a quarter of each budget, a push to main runs it
      # whole: the full count held the PR gate open ~30 s after every other job
      # had reported. See docs/CI_CD.md § "Fuzz smoke" for what the quarter
      # gives up and what covers it.
      - name: Fuzz parsers
        if: steps.scope.outputs.code == 'true'
        run: |
          set -euo pipefail
          # No cache here holds a corpus; clear it anyway so a smoke always
          # starts from the in-code f.Add seeds.
          rm -rf "$(go env GOCACHE)/fuzz"
          case "$GITHUB_EVENT_NAME" in
            pull_request) divisor=4 ;;
            *) divisor=1 ;;
          esac
          # package, target, executions on main (divided by $divisor on a PR)
          targets=(
            "./internal/play/api FuzzParseErrorEnvelope 45000"
            "./internal/transport FuzzScopesFromAssertion 55000"
            "./internal/transport FuzzParseRetryAfter 75000"
            "./internal/reviews/batch FuzzParse 230000"
            "./internal/reviews/history FuzzHistoryParse 200000"
            "./internal/reports FuzzDecode 100000"
            "./internal/reports FuzzExtractCSV 85000"
            "./internal/artifact FuzzParseBinaryXMLPackage 70000"
            "./internal/artifact FuzzParseProtoManifestPackage 90000"
            "./internal/redact FuzzRedactString 8000"
            "./internal/output FuzzSanitizeCell 100000"
            "./internal/compliance/datasafety FuzzDataSafetyValidate 380000"
          )
          # Every Fuzz function in the tree must be listed: a new target that
          # only replays its seeds in `test` is the gap this job exists for.
          found=$(grep -rEo --include='*_test.go' '^func Fuzz[A-Za-z0-9_]*' cmd commands internal |
            sed -E 's#^(.*)/[^/]*:func (.*)$#./\1 \2#' | sort -u)
          listed=$(printf '%s\n' "${targets[@]}" | awk '{print $1, $2}' | sort -u)
          if [ "$found" != "$listed" ]; then
            diff <(echo "$listed") <(echo "$found") || true
            echo '::error::the fuzz target list differs from the Fuzz functions in the tree (> missing, < stale)'
            exit 1
          fi
          # Instrumented builds share most of their dependencies (the standard
          # library included). Build them once up front: ten concurrent `go
          # test` would each compile them again.
          go test -run='^$' -fuzz='^FuzzParseErrorEnvelope$' -fuzztime=1x ./internal/play/api > /dev/null
          logs="$RUNNER_TEMP/fuzz"
          mkdir -p "$logs"
          declare -A pid
          for t in "${targets[@]}"; do
            read -r pkg fn execs <<<"$t"
            go test -run='^$' -fuzz="^${fn}\$" -fuzztime="$((execs / divisor))x" -fuzzminimizetime=0 -parallel=1 "$pkg" > "$logs/$fn.log" 2>&1 &
            pid[$fn]=$!
          done
          failed=()
          for fn in "${!pid[@]}"; do
            if wait "${pid[$fn]}"; then status=ok; else status=FAILED; failed+=("$fn"); fi
            echo "::group::$fn: $status, $(grep -o 'execs: [0-9]*' "$logs/$fn.log" | tail -n 1)"
            cat "$logs/$fn.log"
            echo "::endgroup::"
          done
          if [ "${#failed[@]}" -gt 0 ]; then
            # A crasher is written under testdata/fuzz in its package: print it
            # so the run log alone reproduces it.
            find . -path '*/testdata/fuzz/*' -type f -newer go.mod -print -exec cat {} \;
            echo "::error::fuzz targets failed: ${failed[*]}"
            exit 1
          fi

  docs:
    name: Docs sanity
    runs-on: ubuntu-latest
    # Always runs: it's a required check, and its steps (verb gate, dash gate,
    # comment ratchet, shellcheck, required-files) are cheap and relevant to
    # every PR regardless of scope.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verb vocabulary gate (ADR-0019)
        run: bash scripts/verb-gate.sh

      - name: Em dash gate (help text and error messages reach users)
        run: bash scripts/dash-gate.sh

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Comment ratchet (no file gains comment lines)
        run: scripts/lint/comments.py check

      - name: shellcheck install.sh
        run: shellcheck install.sh scripts/install-test.sh scripts/repin-skills.sh

      # Offline: a stub curl serves a fixture release, so this asserts the
      # fail-closed sha256 gate without touching the network.
      - name: Install script fail-closed checksum gate
        run: bash scripts/install-test.sh

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false

      # Offline: a fake fetch stands in for GitHub. Asserts that gplay.sh/install
      # serves install.sh from the latest release tag and never from `main`
      # (#601, ADR-0009 amendment). Here rather than in a path-gated job
      # because deploy/ is outside the `code` filter.
      - name: gplay.sh Worker install route
        run: node --test deploy/gplay.sh/worker.test.mjs deploy/gplay.sh/install.test.mjs

      # The list lives in the script so `make check` runs the same one.
      - name: Verify required files exist
        run: bash scripts/required-files.sh
