name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push to a PR supersedes the older run, so a PR keeps one group per
# ref and cancels. A push to main gets a group of its own (the run id) and never
# cancels: two merges landing seconds apart must both get a verdict (a
# cancelled main run hid whether #547 alone was sound) and both save the living
# Go cache. Turning cancel-in-progress off on a shared group would not be
# enough: GitHub still cancels the pending run when a third one queues, which
# is also why the group is per run and not per sha. See docs/CI_CD.md
# § "Concurrency: PRs cancel, main never does".
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Detect the scope of the diff so the heavy jobs can short-circuit on
  # docs/site-only changes. Gating is by *changed paths*: any .go / go.mod /
  # go.sum / Makefile / .github / scripts touch flips `code` true and the full
  # pipeline runs. See docs/CI_CD.md § "Path-based job gating".
  changes:
    name: Detect change scope
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          # `code` = anything that can change the built binary or the CI/build
          # machinery itself. Mirrors the docs-only definition in AGENTS.md: a
          # PR touching none of these is docs/site-only and skips build+fuzz.
          #
          # The Go source directories are matched wholesale rather than by
          # `*.go` extension, because the binary embeds non-Go files too
          # (`internal/schemaindex/schema_index.json`,
          # `internal/compliance/datasafety/reference.csv`). Gating on the
          # extension let those through as "docs-only", skipping the very tests
          # that guard them. Directory-level globs keep any future `go:embed`
          # covered by default; there are no docs under these paths, so nothing
          # is over-triggered.
          filters: |
            code:
              - 'cmd/**'
              - 'commands/**'
              - 'internal/**'
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
              - 'Makefile'
              - '.github/**'
              - 'scripts/**'
              - 'install.sh'
              # Inputs to `make schema-index-update`: they live under docs/ but
              # a change here can desynchronise the embedded Schema index.
              - 'docs/discovery/**'
              # Generated by `make coverage-update`, and its freshness test
              # (internal/coveragedoc) only runs when `code` is true. Left out,
              # a hand edit of this one file would pass as docs-only.
              - 'docs/COVERAGE.md'
              # Hold blocks generated by `make docs-update`, whose freshness
              # test (cmd/gplay docs_test.go) likewise only runs on `code`.
              - 'README.md'
              - 'website/src/content/docs/docs/concepts/exit-codes.md'
              - 'website/src/content/docs/docs/concepts/stability.md'

  # "Build, lint, test" used to be one serial job (gofmt, vet, golangci-lint,
  # `go test -race`, build: ~7.5 min, the test step alone ~6.5 min). It is now
  # three jobs: `lint` and the `test` shards run in parallel, and `build` is the
  # aggregator that carries the required check's name. See docs/CI_CD.md
  # § "Build, lint, test: parallel jobs and a living Go cache".
  lint:
    name: Lint (gofmt, vet, golangci-lint, build)
    runs-on: ubuntu-latest
    needs: changes
    # Not a required check itself: `build` below aggregates its result, so a
    # job-level skip on docs-only PRs is safe here.
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Same living cache as the `test` shards (see there), under its own key:
      # `go vet` spends most of its time compiling the project's packages.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        id: go
        with:
          go-version-file: go.mod
          cache: false

      - name: Locate Go caches
        id: gocache
        run: |
          echo "build=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
          echo "mod=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"

      - name: Restore Go build and module cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.gocache.outputs.build }}
            ${{ steps.gocache.outputs.mod }}
          key: go-lint-${{ runner.os }}-go${{ steps.go.outputs.go-version }}-${{ github.sha }}
          restore-keys: |
            go-lint-${{ runner.os }}-go${{ steps.go.outputs.go-version }}-

      - name: gofmt
        run: |
          diff <(gofmt -d .) <(echo -n) || (echo '::error::run "make format" to fix formatting'; exit 1)

      # The release hook runs the same check (.goreleaser.yaml): a go.mod or
      # go.sum that drifts from `go mod tidy` fails here, on the PR, rather
      # than at tag time.
      - name: go mod tidy
        run: go mod tidy -diff || (echo '::error::run "go mod tidy" and commit go.mod/go.sum'; exit 1)

      - name: go vet
        run: go vet ./...

      # golangci-lint refuses to lint for a Go newer than the Go it was built
      # with, and it targets go.mod's `toolchain` line: moving that line to a
      # new minor needs a golangci-lint release built with it (v2.13.2: go1.27).
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.2

      - name: build
        run: go build ./cmd/gplay

      - name: Save Go build and module cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.gocache.outputs.build }}
            ${{ steps.gocache.outputs.mod }}
          key: go-lint-${{ runner.os }}-go${{ steps.go.outputs.go-version }}-${{ github.sha }}

  test:
    name: Test (shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    needs: changes
    # Same as `lint`: aggregated by `build`, so skipping it outright is safe.
    if: needs.changes.outputs.code == 'true'
    strategy:
      # Let every shard finish: one red shard should not hide a second one.
      fail-fast: false
      matrix:
        # The shard count is read back from strategy.job-total below, so adding
        # a shard means adding a number here and nothing else.
        shard: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # setup-go's own cache is keyed on go.sum only and is never rewritten once
      # the key exists, so it never holds the project's compiled packages or
      # test results. The explicit cache below replaces it.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        id: go
        with:
          go-version-file: go.mod
          cache: false

      - name: Locate Go caches
        id: gocache
        run: |
          echo "build=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
          echo "mod=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"

      # A living cache: one entry per main commit (the key ends in the sha),
      # restored by prefix. PRs only read it; only pushes to main write it (see
      # the save step), so a PR can never feed the cache another PR reads.
      - name: Restore Go build and module cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.gocache.outputs.build }}
            ${{ steps.gocache.outputs.mod }}
          key: go-test-${{ runner.os }}-go${{ steps.go.outputs.go-version }}-shard${{ strategy.job-index }}of${{ strategy.job-total }}-${{ github.sha }}
          restore-keys: |
            go-test-${{ runner.os }}-go${{ steps.go.outputs.go-version }}-shard${{ strategy.job-index }}of${{ strategy.job-total }}-
            go-test-${{ runner.os }}-go${{ steps.go.outputs.go-version }}-

      # Packages are dealt round-robin over `go list ./...`, so every package
      # lands in exactly one shard and a new package needs no CI edit. The few
      # packages whose tests run far longer than the rest are dealt first, one
      # per shard, so they never stack up on the same runner; a stale name in
      # that list is simply ignored.
      - name: go test -race (shard ${{ matrix.shard }} of ${{ strategy.job-total }})
        env:
          SHARD: ${{ strategy.job-index }}
          SHARDS: ${{ strategy.job-total }}
        run: |
          set -euo pipefail
          module=$(go list -m)
          slow="internal/artifact commands/releases/upload commands/releases/expansion-files/upload internal/metadata/imagevalidate"
          all=$(go list ./...)
          ordered=$(
            for s in $slow; do grep -xF "$module/$s" <<<"$all" || true; done
            grep -vxF -f <(for s in $slow; do echo "$module/$s"; done) <<<"$all"
          )
          # Guard: the reordering must neither drop nor duplicate a package.
          if [ "$(sort <<<"$ordered")" != "$(sort <<<"$all")" ]; then
            echo '::error::shard package list does not match go list ./...'
            exit 1
          fi
          mapfile -t pkgs < <(awk -v n="$SHARDS" -v i="$SHARD" '(NR-1) % n == i' <<<"$ordered")
          echo "shard $SHARD/$SHARDS: ${#pkgs[@]} of $(wc -l <<<"$all") packages"
          go test -race "${pkgs[@]}"

      - name: Save Go build and module cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.gocache.outputs.build }}
            ${{ steps.gocache.outputs.mod }}
          key: go-test-${{ runner.os }}-go${{ steps.go.outputs.go-version }}-shard${{ strategy.job-index }}of${{ strategy.job-total }}-${{ github.sha }}

  build:
    name: Build, lint, test
    runs-on: ubuntu-latest
    needs: [changes, lint, test]
    # NOTE: "Build, lint, test" is a required check on main, and a *skipped*
    # required job blocks merge (GitHub treats skipped as unsatisfied). So this
    # aggregator runs whatever happened upstream, failures included, and then
    # re-derives the verdict itself. On a docs-only PR `lint` and `test` skip
    # and this job goes green in seconds; on a code PR it is green only if
    # `lint` and every `test` shard succeeded.
    # `!cancelled()`, not `always()`: a superseded PR run skips this job instead
    # of painting the required check red with "change scope detection did not
    # succeed (cancelled)". Still fail-closed: the newer run reports the check,
    # and a head whose only run was cancelled has no "Build, lint, test" at
    # all, which blocks merge.
    if: ${{ !cancelled() }}
    steps:
      - name: Aggregate lint and test results
        env:
          CHANGES: ${{ needs.changes.result }}
          CODE: ${{ needs.changes.outputs.code }}
          LINT: ${{ needs.lint.result }}
          TEST: ${{ needs.test.result }}
        run: |
          echo "changes=$CHANGES code=$CODE lint=$LINT test=$TEST"
          # A failed scope detection leaves `code` empty, which would otherwise
          # read as docs-only and wave the PR through untested.
          if [ "$CHANGES" != success ]; then
            echo "::error::change scope detection did not succeed ($CHANGES)"
            exit 1
          fi
          if [ "$CODE" != true ]; then
            echo 'docs/site-only change: lint and tests skipped by design'
            exit 0
          fi
          # `needs.test.result` is the matrix as a whole: failure or cancelled
          # if any shard is.
          if [ "$LINT" != success ] || [ "$TEST" != success ]; then
            echo "::error::lint=$LINT test=$TEST"
            exit 1
          fi

  fuzz:
    name: Fuzz smoke (untrusted-input parsers)
    runs-on: ubuntu-latest
    needs: changes
    # Fuzz smoke is NOT a required check, so it can be skipped outright at the
    # job level on docs-only PRs — no green-stub gymnastics needed.
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # Short bounded fuzzing of the parsers that consume untrusted bytes (API
      # error envelope, JWT scope claim, reply-batch TSV). The seed corpora run
      # as ordinary cases in the `test` job; this surfaces crashers from
      # generated input without materially slowing it. -fuzztime is small on
      # purpose — this is a smoke, not an exhaustive campaign.
      - name: Fuzz parsers
        run: |
          set -euo pipefail
          # Go persists generated fuzz inputs in $GOCACHE/fuzz, which setup-go's
          # build cache restores across runs. That corpus grows unboundedly and
          # eventually pushes the time-boxed run past the coordinator's shutdown
          # deadline ("context deadline exceeded") on slow runners — seen on the
          # v0.17.0 release PR (#383). Reset it so each smoke starts from the
          # in-code f.Add seeds only; regression cases still run in `test`.
          rm -rf "$(go env GOCACHE)/fuzz"
          go test -run='^$' -fuzz='^FuzzParseErrorEnvelope$' -fuzztime=30s ./internal/play/api/
          go test -run='^$' -fuzz='^FuzzScopesFromAssertion$' -fuzztime=30s ./internal/transport/
          go test -run='^$' -fuzz='^FuzzParse$' -fuzztime=30s ./internal/reviews/batch/

  docs:
    name: Docs sanity
    runs-on: ubuntu-latest
    # Always runs: it's a required check, and its steps (verb gate, dash gate,
    # shellcheck, required-files) are cheap and relevant to every PR regardless
    # of scope.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verb vocabulary gate (ADR-0019)
        run: bash scripts/verb-gate.sh

      - name: Em dash gate (help text and error messages reach users)
        run: bash scripts/dash-gate.sh

      - name: shellcheck install.sh
        run: shellcheck install.sh scripts/install-test.sh

      # Offline: a stub curl serves a fixture release, so this asserts the
      # fail-closed sha256 gate without touching the network.
      - name: Install script fail-closed checksum gate
        run: bash scripts/install-test.sh

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          package-manager-cache: false

      # Offline: a fake fetch stands in for GitHub. Asserts that gplay.sh/install
      # serves install.sh from the latest release tag and never from `main`
      # (#601, ADR-0009 amendment). Here rather than in a path-gated job
      # because deploy/ is outside the `code` filter.
      - name: gplay.sh Worker install route
        run: node --test deploy/gplay.sh/worker.test.mjs deploy/gplay.sh/install.test.mjs

      # The list lives in the script so `make check` runs the same one.
      - name: Verify required files exist
        run: bash scripts/required-files.sh
