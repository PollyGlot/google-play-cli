<!doctype html>
<!--
  gplay social card — terminal demo (1600×900)
  EDIT ONLY the marked lines. Do not touch CSS/palette.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans+Code:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#050507;--ink:#fff;--ink-soft:#d4d4d8;--ink-mute:#8a8a90;--green:#3DDC84;--magenta:255,110,195;--blue:130,175,255}
    *{margin:0;padding:0;box-sizing:border-box}
    html,body{width:1600px;height:900px;overflow:hidden;background:var(--bg);font-family:'Google Sans Code',monospace}
    .card{position:relative;width:1600px;height:900px;overflow:hidden}
    .aurora{position:absolute;inset:0;z-index:0;
      background:
        radial-gradient(ellipse 900px 700px at 95% 15%,rgba(var(--magenta),0.32),transparent 70%),
        radial-gradient(ellipse 800px 700px at 100% 50%,rgba(var(--blue),0.26),transparent 70%);
      filter:blur(60px) saturate(120%);pointer-events:none}
    .grid{position:absolute;inset:0;z-index:1;
      background-image:linear-gradient(rgba(255,255,255,0.015) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,0.015) 1px,transparent 1px);
      background-size:56px 56px;pointer-events:none}
    .stage{position:relative;z-index:2;width:100%;height:100%;display:flex;align-items:center;justify-content:center;padding:90px}
    .terminal{width:100%;max-width:1420px;background:#0c0c10;border:1px solid rgba(255,255,255,0.08);border-radius:20px;overflow:hidden;
      box-shadow:0 0 0 1px rgba(255,255,255,0.04),0 40px 100px rgba(0,0,0,0.6)}
    .chrome{background:rgba(255,255,255,0.025);padding:20px 28px;display:flex;align-items:center;gap:10px;border-bottom:1px solid rgba(255,255,255,0.05)}
    .traffic{width:15px;height:15px;border-radius:50%}
    .traffic.r{background:#ff5f56}.traffic.y{background:#ffbd2e}.traffic.g{background:#27c93f}
    .chrome .title{flex:1;text-align:center;font-size:20px;color:var(--ink-mute);letter-spacing:0.3px}
    .chrome .title .v{color:var(--ink-soft)}
    .body{padding:48px 56px 56px 56px;font-size:28px;line-height:1.7;color:var(--ink-soft)}
    .prompt{color:var(--green);margin-right:14px}
    .arrow{color:var(--green);margin-right:10px}
    .ok{color:var(--green)}
    .heading{color:var(--ink);font-weight:500}
    .muted{color:var(--ink-mute)}
    .cmd{color:var(--green)}
    .flag{color:var(--ink-mute)}
    .spacer{height:18px}
    .indent{padding-left:32px}
  </style>
</head>
<body>
  <div class="card">
    <div class="aurora"></div><div class="grid"></div>
    <div class="stage">
      <div class="terminal">

        <!-- EDIT: title bar version (optional) -->
        <div class="chrome">
          <div class="traffic r"></div><div class="traffic y"></div><div class="traffic g"></div>
          <div class="title">gplay&nbsp;&nbsp;<span class="v">v0.1.0-alpha.X</span></div>
        </div>

        <!-- EDIT: terminal body — prompt+command, then output lines.
             Available spans:
               <span class="prompt">$</span>     green dollar prompt
               <span class="arrow">→</span>      green arrow (for results)
               <span class="ok">…</span>         green success text
               <span class="flag">…</span>       muted flag text
               <span class="cmd">…</span>        green emphasis (e.g. subcommand name)
               <span class="heading">…</span>    bold white
               <span class="muted">…</span>      muted gray
             Wrap blocks with <div class="spacer"></div> or <div class="indent">…</div>
        -->
        <div class="body">
          <div><span class="prompt">$</span>gplay something --flag</div>
          <div><span class="arrow">→</span><span class="ok">success result</span></div>
        </div>

      </div>
    </div>
  </div>
</body>
</html>
