run:
  timeout: 5m
  go: "1.22"

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
    - gofmt
    - goimports

issues:
  exclude-rules:
    # Allow init() functions and main without checking returns of fmt.Println etc.
    - path: cmd/gplay/main.go
      linters:
        - errcheck
